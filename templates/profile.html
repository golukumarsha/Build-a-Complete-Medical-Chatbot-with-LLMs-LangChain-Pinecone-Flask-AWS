<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediBot — Mera Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #080e14; --surface: #0f1923; --surface2: #162030;
      --border: #1e3048; --accent: #00c896; --accent-dim: #00c89622;
      --blue: #3b9eff; --blue-dim: #3b9eff18;
      --text: #d8eaf8; --muted: #5a7a99;
      --danger: #ff5c5c; --danger-dim: #ff5c5c18;
    }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: "Sora", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px; opacity:.18; pointer-events:none; z-index:0;
    }

    /* ── Header ── */
    header {
      display:flex; align-items:center; gap:14px;
      padding:14px 28px;
      border-bottom:1px solid var(--border);
      background: var(--surface);
      position: sticky; top:0; z-index:100;
    }
    .logo-icon {
      width:40px; height:40px; border-radius:12px;
      background:linear-gradient(135deg,#00c896,#3b9eff);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .logo-text { font-family:"Playfair Display",serif; font-size:1.15rem; color:#fff; }
    .logo-text span { color:var(--accent); }
    .header-right { margin-left:auto; display:flex; gap:10px; align-items:center; }
    .nav-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:10px; padding:7px 14px;
      color:var(--muted); font-size:.78rem;
      text-decoration:none; font-family:"Sora",sans-serif;
      transition:all .2s; cursor:pointer;
    }
    .nav-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
    .logout-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:var(--danger-dim); border:1px solid rgba(255,92,92,.3);
      border-radius:10px; padding:7px 14px;
      color:var(--danger); font-size:.78rem;
      font-family:"Sora",sans-serif;
      transition:all .2s; cursor:pointer;
    }
    .logout-btn:hover { background:var(--danger); color:#fff; }

    /* ── Main layout ── */
    .main {
      position:relative; z-index:1;
      max-width:900px; margin:0 auto;
      padding:30px 20px;
      display:grid; grid-template-columns:300px 1fr; gap:24px;
    }
    @media(max-width:700px) { .main { grid-template-columns:1fr; } }

    /* ── Profile Card ── */
    .profile-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:20px; padding:28px 24px;
      height: fit-content;
    }
    .avatar {
      width:72px; height:72px; border-radius:50%;
      background:linear-gradient(135deg,#00c896,#3b9eff);
      display:flex; align-items:center; justify-content:center;
      font-size:32px; margin:0 auto 16px;
      box-shadow:0 0 24px rgba(0,200,150,.3);
    }
    .profile-name {
      text-align:center;
      font-family:"Playfair Display",serif;
      font-size:1.3rem; color:#fff; margin-bottom:4px;
    }
    .profile-email { text-align:center; color:var(--muted); font-size:13px; margin-bottom:16px; }

    .role-badge {
      display:inline-block; margin:0 auto 20px;
      padding:5px 14px; border-radius:20px;
      font-size:12px; font-weight:700; letter-spacing:.5px;
      text-align:center; display:block; width:fit-content; margin:0 auto 20px;
    }
    .role-badge.patient { background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent); }
    .role-badge.doctor  { background:var(--blue-dim);   border:1px solid var(--blue);   color:var(--blue);   }

    .divider { border:none; border-top:1px solid var(--border); margin:16px 0; }

    .info-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .info-label { font-size:12px; color:var(--muted); }
    .info-value { font-size:13px; color:var(--text); font-weight:500; }

    /* Doctor info box */
    .doctor-box {
      background:var(--blue-dim); border:1px solid rgba(59,158,255,.2);
      border-radius:12px; padding:14px; margin-top:12px;
    }
    .doctor-box-title { font-size:11px; color:var(--blue); font-weight:700; letter-spacing:.5px; margin-bottom:10px; }

    /* ── Stats ── */
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
    .stat-box {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:12px; padding:14px; text-align:center;
    }
    .stat-num  { font-size:1.6rem; font-weight:700; color:var(--accent); }
    .stat-label{ font-size:11px; color:var(--muted); margin-top:2px; }

    /* ── Chat History Panel ── */
    .history-panel {
      background:var(--surface); border:1px solid var(--border);
      border-radius:20px; padding:24px;
      display:flex; flex-direction:column; gap:0;
      min-height:500px;
    }
    .panel-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:20px;
    }
    .panel-title { font-family:"Playfair Display",serif; font-size:1.1rem; color:#fff; }
    .clear-btn {
      background:var(--danger-dim); border:1px solid rgba(255,92,92,.25);
      border-radius:8px; padding:6px 12px;
      color:var(--danger); font-size:12px;
      cursor:pointer; font-family:"Sora",sans-serif;
      transition:all .2s;
    }
    .clear-btn:hover { background:var(--danger); color:#fff; }

    /* Chat history items */
    .history-list { display:flex; flex-direction:column; gap:14px; overflow-y:auto; max-height:600px; }
    .history-list::-webkit-scrollbar { width:3px; }
    .history-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

    .chat-item {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:14px; padding:16px;
      animation: fadeUp .3s ease;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .chat-question {
      font-size:14px; color:var(--blue); font-weight:600; margin-bottom:8px;
      display:flex; gap:8px;
    }
    .chat-answer {
      font-size:13px; color:var(--muted); line-height:1.65;
      display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    }
    .chat-time { font-size:11px; color:var(--border); margin-top:8px; text-align:right; }

    /* Empty state */
    .empty-state {
      text-align:center; padding:60px 20px;
      color:var(--muted);
    }
    .empty-state .empty-icon { font-size:48px; display:block; margin-bottom:16px; opacity:.5; }
    .empty-state p { font-size:14px; }

    /* Loading */
    .loading {
      text-align:center; padding:40px;
      color:var(--muted); font-size:14px;
    }
    .loading-dots span {
      display:inline-block; width:8px; height:8px; border-radius:50%;
      background:var(--accent); margin:0 3px;
      animation:dot 1.2s infinite;
    }
    .loading-dots span:nth-child(2){animation-delay:.2s}
    .loading-dots span:nth-child(3){animation-delay:.4s}
    @keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

    /* Toast */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:10px 20px;
      font-size:13px; color:var(--text);
      z-index:999; box-shadow:0 4px 20px rgba(0,0,0,.4);
      animation:toastIn .25s ease;
    }
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo-icon">🩺</div>
  <div class="logo-text">Medi<span>Bot</span></div>
  <div class="header-right">
    <a href="/" class="nav-btn">🏠 Chatbot</a>
    <a href="/medicines" class="nav-btn">💊 Medicines</a>
    <button class="logout-btn" onclick="doLogout()">🚪 Logout</button>
  </div>
</header>

<!-- ── Main ── -->
<div class="main">

  <!-- LEFT: Profile Card -->
  <div>
    <div class="profile-card">
      <div class="avatar" id="avatarEl">👤</div>
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="profile-email" id="profileEmail">—</div>
      <div class="role-badge patient" id="roleBadge">Patient</div>

      <hr class="divider"/>

      <div class="info-row">
        <span class="info-label">Member since</span>
        <span class="info-value" id="memberSince">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Last login</span>
        <span class="info-value" id="lastLogin">—</span>
      </div>

      <!-- Doctor Info (only for doctors) -->
      <div class="doctor-box" id="doctorBox" style="display:none">
        <div class="doctor-box-title">🏥 DOCTOR INFORMATION</div>
        <div class="info-row" style="margin-bottom:8px">
          <span class="info-label">Specialization</span>
          <span class="info-value" id="docSpec">—</span>
        </div>
        <div class="info-row" style="margin-bottom:8px">
          <span class="info-label">License No.</span>
          <span class="info-value" id="docLicense">—</span>
        </div>
        <div class="info-row" style="margin-bottom:0">
          <span class="info-label">Hospital</span>
          <span class="info-value" id="docHospital">—</span>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num" id="totalChats">0</div>
          <div class="stat-label">Total Chats</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="todayChats">0</div>
          <div class="stat-label">Aaj ke Chats</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Chat History -->
  <div class="history-panel">
    <div class="panel-header">
      <div class="panel-title">🗂 Meri Chat History</div>
      <button class="clear-btn" onclick="clearHistory()">🗑 Saaf karo</button>
    </div>

    <div id="historyContainer">
      <div class="loading">
        <div class="loading-dots"><span></span><span></span><span></span></div>
        <p style="margin-top:12px">History load ho rahi hai...</p>
      </div>
    </div>
  </div>

</div>

<script>
  const token = localStorage.getItem("medibot_token");
  const user  = JSON.parse(localStorage.getItem("medibot_user") || "null");

  // Login nahi hai → redirect
  if (!token || !user) {
    window.location.href = "/login";
  }

  /* ── Fill profile from localStorage ── */
  function fillProfile(u) {
    const isDoctor = u.role === "doctor";

    document.getElementById("avatarEl").textContent    = isDoctor ? "👨‍⚕️" : "🧑‍💼";
    document.getElementById("profileName").textContent = isDoctor ? "Dr. " + u.username : u.username;
    document.getElementById("profileEmail").textContent= u.email || "—";

    const badge = document.getElementById("roleBadge");
    badge.textContent = isDoctor ? "👨‍⚕️ Doctor" : "🧑‍💼 Patient";
    badge.className   = isDoctor ? "role-badge doctor" : "role-badge patient";

    if (u.created_at) {
      document.getElementById("memberSince").textContent =
        new Date(u.created_at).toLocaleDateString("en-IN", {day:"2-digit",month:"short",year:"numeric"});
    }
    if (u.last_login) {
      document.getElementById("lastLogin").textContent =
        new Date(u.last_login).toLocaleDateString("en-IN", {day:"2-digit",month:"short",year:"numeric"});
    }

    // Doctor info
    if (isDoctor && u.doctor_info) {
      document.getElementById("doctorBox").style.display = "block";
      document.getElementById("docSpec").textContent    = u.doctor_info.specialization || "—";
      document.getElementById("docLicense").textContent = u.doctor_info.license_no     || "—";
      document.getElementById("docHospital").textContent= u.doctor_info.hospital       || "—";
    }
  }

  /* ── Load chat history from server ── */
  async function loadHistory() {
    try {
      const res  = await fetch("/auth/history?limit=50", {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      const container = document.getElementById("historyContainer");

      if (!data.success || !data.data || data.data.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">💬</span>
            <p>Abhi tak koi chat nahi ki!<br/>
            <a href="/" style="color:var(--accent);text-decoration:none">Chatbot pe jao →</a></p>
          </div>`;
        return;
      }

      // Stats update
      document.getElementById("totalChats").textContent = data.count;
      const today = new Date().toDateString();
      const todayCount = data.data.filter(c =>
        c.created_at && new Date(c.created_at).toDateString() === today
      ).length;
      document.getElementById("todayChats").textContent = todayCount;

      // Render
      const list = document.createElement("div");
      list.className = "history-list";

      data.data.forEach(chat => {
        const item = document.createElement("div");
        item.className = "chat-item";

        const timeStr = chat.created_at
          ? new Date(chat.created_at).toLocaleString("en-IN", {
              day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"
            })
          : "";

        item.innerHTML = `
          <div class="chat-question">💬 ${escHtml(chat.message || "")}</div>
          <div class="chat-answer">🤖 ${escHtml(chat.response || "")}</div>
          <div class="chat-time">${timeStr}</div>`;
        list.appendChild(item);
      });

      container.innerHTML = "";
      container.appendChild(list);

    } catch (err) {
      document.getElementById("historyContainer").innerHTML =
        `<div class="empty-state"><span class="empty-icon">⚠️</span><p>History load nahi hui.<br/>Server se connect karo.</p></div>`;
    }
  }

  /* ── Clear history ── */
  async function clearHistory() {
    if (!confirm("Kya aap sach mein saari chat history delete karna chahte hain?")) return;
    try {
      const res  = await fetch("/auth/history", {
        method:  "DELETE",
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      if (data.success) {
        showToast("🗑 " + data.message);
        document.getElementById("totalChats").textContent = "0";
        document.getElementById("todayChats").textContent = "0";
        document.getElementById("historyContainer").innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">💬</span>
            <p>History saaf ho gayi!<br/>
            <a href="/" style="color:var(--accent);text-decoration:none">Chatbot pe jao →</a></p>
          </div>`;
      }
    } catch (err) {
      showToast("❌ Delete nahi hua — server check karo");
    }
  }

  /* ── Logout ── */
  function doLogout() {
    fetch("/auth/logout", {
      method:  "POST",
      headers: { "Authorization": "Bearer " + token }
    }).finally(() => {
      localStorage.removeItem("medibot_token");
      localStorage.removeItem("medibot_user");
      window.location.href = "/login";
    });
  }

  /* ── Utils ── */
  function escHtml(s) {
    return String(s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");
  }
  function showToast(msg) {
    const t = document.createElement("div");
    t.className   = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  /* ── Init ── */
  fillProfile(user);
  loadHistory();
</script>

</body>
</html>
