<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediBot — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #080e14;
      --surface: #0f1923;
      --surface2: #162030;
      --border: #1e3048;
      --accent: #00c896;
      --accent-dim: #00c89622;
      --blue: #3b9eff;
      --blue-dim: #3b9eff18;
      --text: #d8eaf8;
      --muted: #5a7a99;
      --danger: #ff5c5c;
      --danger-dim: #ff5c5c18;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Sora", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.18;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(0,200,150,.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(59,158,255,.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 0 60px rgba(0,200,150,.06);
    }

    /* ── Logo ── */
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #00c896, #3b9eff);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin: 0 auto 12px;
      box-shadow: 0 0 24px rgba(0,200,150,.3);
    }
    .logo h1 {
      font-family: "Playfair Display", serif;
      font-size: 24px; color: #fff;
    }
    .logo h1 span { color: var(--accent); }
    .logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* ── Role selector ── */
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }
    .role-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: var(--surface2);
    }
    .role-card:hover { border-color: var(--accent); }
    .role-card.active {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .role-card.active.doctor-card {
      border-color: var(--blue);
      background: var(--blue-dim);
    }
    .role-icon { font-size: 26px; display: block; margin-bottom: 6px; }
    .role-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .role-desc  { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: .3px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: "Sora", sans-serif;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,200,150,.12);
    }
    input::placeholder { color: var(--muted); }
    select option { background: var(--surface2); }

    /* Doctor extra fields */
    #doctorFields {
      display: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      background: var(--blue-dim);
    }
    #doctorFields .section-title {
      font-size: 12px;
      color: var(--blue);
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: .5px;
    }

    /* Password strength */
    .pw-strength {
      margin-top: 6px;
      height: 3px;
      border-radius: 3px;
      background: var(--border);
      overflow: hidden;
    }
    .pw-strength-bar {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      transition: width .3s, background .3s;
    }
    .pw-strength-text {
      font-size: 11px;
      margin-top: 4px;
      color: var(--muted);
    }

    /* ── Button ── */
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 15px;
      font-weight: 600;
      font-family: "Sora", sans-serif;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: 6px;
    }
    .btn:hover   { opacity: .9; }
    .btn:active  { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ── Alert ── */
    .alert {
      display: none;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      animation: slideDown .2s ease;
    }
    .alert.error   { background: var(--danger-dim); border: 1px solid rgba(255,92,92,.3); color: #ff8080; }
    .alert.success { background: var(--accent-dim); border: 1px solid rgba(0,200,150,.3); color: var(--accent); }
    @keyframes slideDown { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }

    /* ── Spinner ── */
    .spinner { display:inline-block; width:15px; height:15px; border:2px solid rgba(0,0,0,.2); border-top-color:#000; border-radius:50%; animation:spin .7s linear infinite; margin-right:8px; vertical-align:middle; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── Footer links ── */
    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer-links a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .footer-links a:hover { text-decoration: underline; }

    .back-link {
      text-align: center;
      margin-top: 12px;
    }
    .back-link a { color: var(--muted); text-decoration: none; font-size: 12px; }
    .back-link a:hover { color: var(--accent); }
  </style>
</head>
<body>

<div class="card">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon">🩺</div>
    <h1>Medi<span>Bot</span></h1>
    <p>Naya account banao — bilkul free</p>
  </div>

  <!-- Alert -->
  <div class="alert" id="alert"></div>

  <!-- Role Selector -->
  <div class="role-selector">
    <div class="role-card active" id="patientCard" onclick="selectRole('patient')">
      <span class="role-icon">🧑‍💼</span>
      <div class="role-label">Patient</div>
      <div class="role-desc">Medical help chahiye</div>
    </div>
    <div class="role-card doctor-card" id="doctorCard" onclick="selectRole('doctor')">
      <span class="role-icon">👨‍⚕️</span>
      <div class="role-label">Doctor</div>
      <div class="role-desc">Medical professional</div>
    </div>
  </div>

  <!-- Basic Fields -->
  <div class="form-group">
    <label>👤 Username</label>
    <input type="text" id="username" placeholder="aapka naam (min 3 characters)" autocomplete="username"/>
  </div>

  <div class="form-group">
    <label>📧 Email</label>
    <input type="email" id="email" placeholder="aapka@email.com" autocomplete="email"/>
  </div>

  <div class="form-group">
    <label>🔒 Password</label>
    <input type="password" id="password" placeholder="min 6 characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
    <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
    <div class="pw-strength-text" id="pwText"></div>
  </div>

  <!-- Doctor Extra Fields -->
  <div id="doctorFields">
    <div class="section-title">🏥 DOCTOR INFORMATION (Optional)</div>
    <div class="form-group">
      <label>Specialization</label>
      <select id="specialization">
        <option value="">-- Select Specialization --</option>
        <option>General Physician</option>
        <option>Cardiologist</option>
        <option>Neurologist</option>
        <option>Orthopedic</option>
        <option>Pediatrician</option>
        <option>Dermatologist</option>
        <option>Psychiatrist</option>
        <option>Gynecologist</option>
        <option>ENT Specialist</option>
        <option>Ophthalmologist</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>License / Registration No.</label>
      <input type="text" id="licenseNo" placeholder="MCI / State Medical Council No."/>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label>Hospital / Clinic</label>
      <input type="text" id="hospital" placeholder="Hospital ya clinic ka naam"/>
    </div>
  </div>

  <!-- Register Button -->
  <button class="btn" id="registerBtn" onclick="doRegister()">
    ✏️ Account banao
  </button>

  <div class="footer-links">
    Pehle se account hai? <a href="/login">Login karo →</a>
  </div>
  <div class="back-link">
    <a href="/">← Chatbot pe jao (bina login)</a>
  </div>

</div>

<script>
  // Already logged in → redirect
  if (localStorage.getItem("medibot_token")) {
    window.location.href = "/";
  }

  let selectedRole = "patient";

  /* ── Role select ── */
  function selectRole(role) {
    selectedRole = role;
    document.getElementById("patientCard").classList.toggle("active",  role === "patient");
    document.getElementById("doctorCard").classList.toggle("active",   role === "doctor");
    document.getElementById("doctorFields").style.display = role === "doctor" ? "block" : "none";
  }

  /* ── Password strength ── */
  function checkStrength(pw) {
    const bar  = document.getElementById("pwBar");
    const text = document.getElementById("pwText");
    let score = 0;
    if (pw.length >= 6)  score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;

    const levels = [
      { w: "0%",   color: "transparent", label: "" },
      { w: "25%",  color: "#ff5c5c",     label: "❌ Bahut kamzor" },
      { w: "50%",  color: "#ffa500",     label: "⚠️ Theek hai" },
      { w: "75%",  color: "#3b9eff",     label: "✅ Achha" },
      { w: "100%", color: "#00c896",     label: "🔒 Bahut strong!" },
    ];
    const lvl = levels[Math.min(score, 4)];
    bar.style.width      = lvl.w;
    bar.style.background = lvl.color;
    text.textContent     = lvl.label;
    text.style.color     = lvl.color;
  }

  /* ── Alert ── */
  function showAlert(msg, type = "error") {
    const el = document.getElementById("alert");
    el.textContent    = msg;
    el.className      = `alert ${type}`;
    el.style.display  = "block";
    el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function hideAlert() {
    document.getElementById("alert").style.display = "none";
  }

  /* ── Register ── */
  async function doRegister() {
    hideAlert();

    const username = document.getElementById("username").value.trim();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn      = document.getElementById("registerBtn");

    // ── Client-side validation ──
    if (!username || !email || !password) {
      showAlert("⚠️ Sabhi fields bharna zaroori hai!"); return;
    }
    if (username.length < 3) {
      showAlert("⚠️ Username kam se kam 3 characters ka hona chahiye!"); return;
    }
    if (!/^[\w\.-]+@[\w\.-]+\.\w{2,}$/.test(email)) {
      showAlert("⚠️ Sahi email daalo!"); return;
    }
    if (password.length < 6) {
      showAlert("⚠️ Password kam se kam 6 characters ka hona chahiye!"); return;
    }

    // Doctor extra info
    const doctorInfo = selectedRole === "doctor" ? {
      specialization: document.getElementById("specialization").value,
      license_no:     document.getElementById("licenseNo").value.trim(),
      hospital:       document.getElementById("hospital").value.trim(),
    } : null;

    btn.disabled    = true;
    btn.innerHTML   = '<span class="spinner"></span>Account ban raha hai...';

    try {
      const body = { username, email, password, role: selectedRole };
      if (doctorInfo) Object.assign(body, { doctor_info: doctorInfo });

      const res  = await fetch("/auth/register", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(body)
      });
      const data = await res.json();

      if (data.success) {
        // Token save karo
        localStorage.setItem("medibot_token", data.token);
        localStorage.setItem("medibot_user",  JSON.stringify(data.user));

        showAlert(`🎉 Welcome ${data.user.username}! Account ban gaya — redirect ho raha hai...`, "success");
        setTimeout(() => window.location.href = "/", 1500);
      } else {
        showAlert("❌ " + (data.error || "Registration fail ho gayi"));
        btn.disabled  = false;
        btn.innerHTML = "✏️ Account banao";
      }
    } catch (err) {
      showAlert("❌ Server se connect nahi hua. Flask app chal raha hai?");
      btn.disabled  = false;
      btn.innerHTML = "✏️ Account banao";
    }
  }

  // Enter key support
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") doRegister();
  });
</script>

</body>
</html>
