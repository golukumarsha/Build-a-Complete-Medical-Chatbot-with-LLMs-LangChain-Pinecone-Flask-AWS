<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search History — MediBot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sora:wght@300;400;500;600&display=swap');

:root{
  --bg:#070f18;
  --surface:#0d1b2a;
  --surface2:#112235;
  --border:#1a3a5c;
  --accent:#00d9a0;
  --accent-dim:rgba(0,217,160,0.08);
  --accent-glow:rgba(0,217,160,0.2);
  --blue:#4da8ff;
  --text:#d6eeff;
  --text2:#8aabcc;
  --danger:#ff6b6b;
  --danger-dim:rgba(255,107,107,0.08);
  --hindi:#ff9f43;
  --hinglish:#a29bfe;
  --english:#4da8ff;
  --r:16px;
  --rs:10px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{min-height:100%}

body{
  min-height:100vh;
  background-color:#070f18;
  background-image:radial-gradient(circle at 20% 20%,#0d2040 0%,transparent 60%),
                   radial-gradient(circle at 80% 80%,#091a30 0%,transparent 60%);
  color:#d6eeff;
  font-family:'Sora',system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
}

body::before{
  content:'';
  position:fixed;inset:0;z-index:0;
  background-image:radial-gradient(circle,rgba(26,58,92,0.6) 1px,transparent 1px);
  background-size:36px 36px;
  pointer-events:none;
}

/* ─── HEADER ─────────────────────────── */
header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:16px;
  padding:14px 32px;
  background:rgba(13,27,42,0.95);
  border-bottom:1px solid #1a3a5c;
  backdrop-filter:blur(16px);
}
.logo{
  width:46px;height:46px;border-radius:13px;
  background:linear-gradient(135deg,#00d9a0,#4da8ff);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
  box-shadow:0 0 24px rgba(0,217,160,0.3);
}
.htxt h1{font-family:'Playfair Display',Georgia,serif;font-size:1.2rem;color:#fff;font-weight:700}
.htxt h1 span{color:#00d9a0}
.htxt p{font-size:.65rem;color:#8aabcc;text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.nav-area{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:#112235;border:1px solid #1a3a5c;border-radius:10px;
  padding:8px 16px;color:#8aabcc;font-size:.78rem;
  text-decoration:none;font-family:'Sora',sans-serif;
  transition:border-color .2s,color .2s;cursor:pointer;
}
.nav-btn:hover{border-color:#00d9a0;color:#00d9a0}

/* ─── PAGE ───────────────────────────── */
.page{
  position:relative;z-index:1;
  max-width:940px;margin:0 auto;
  padding:32px 24px 80px;
}

/* ─── BANNER ─────────────────────────── */
.banner{
  display:none;align-items:center;gap:10px;
  background:rgba(0,217,160,0.06);
  border:1px solid rgba(0,217,160,0.3);
  border-radius:var(--rs);padding:11px 18px;
  margin-bottom:22px;font-size:.8rem;color:#00d9a0;
}

/* ─── STATS ──────────────────────────── */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;margin-bottom:24px;
}
.sc{
  background:#112235;
  border:1px solid #1a3a5c;
  border-radius:var(--r);
  padding:20px 18px;
  transition:border-color .25s,transform .2s;
  cursor:default;
}
.sc:hover{border-color:#00d9a0;transform:translateY(-3px)}
.sc-icon{font-size:1.5rem;margin-bottom:10px;display:block}
.sc-num{
  font-family:'Playfair Display',Georgia,serif;
  font-size:2.4rem;line-height:1;
  color:#00d9a0;
  transition:color .3s;
}
.sc-num.empty{color:#1a3a5c}
.sc-lbl{
  font-size:.68rem;color:#8aabcc;
  text-transform:uppercase;letter-spacing:.07em;margin-top:7px;
}

/* ─── LANGUAGE BARS ──────────────────── */
.card{
  background:#112235;border:1px solid #1a3a5c;
  border-radius:var(--r);padding:20px 22px;margin-bottom:18px;
}
.card-title{
  font-size:.7rem;color:#8aabcc;
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;
}
.lang-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.lang-row:last-child{margin-bottom:0}
.lang-lbl{width:90px;font-size:.82rem;color:#d6eeff;flex-shrink:0}
.lang-track{
  flex:1;height:8px;
  background:#0d1b2a;border-radius:4px;overflow:hidden;
}
.lang-fill{
  height:100%;border-radius:4px;
  transition:width .8s cubic-bezier(.4,0,.2,1);
  width:0%;
}
.lang-cnt{font-size:.78rem;color:#8aabcc;width:32px;text-align:right;flex-shrink:0}

/* ─── TOP QUERIES ────────────────────── */
.tq-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid #1a3a5c;
}
.tq-item:last-child{border:none;padding-bottom:0}
.tq-text{font-size:.85rem;color:#d6eeff}
.tq-cnt{
  background:rgba(0,217,160,0.08);
  color:#00d9a0;border:1px solid rgba(0,217,160,0.4);
  border-radius:20px;padding:2px 10px;font-size:.7rem;flex-shrink:0;
}

/* ─── TOOLBAR ────────────────────────── */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search-box{
  flex:1;min-width:220px;
  background:#112235;border:1px solid #1a3a5c;border-radius:10px;
  display:flex;align-items:center;gap:8px;padding:0 14px;
  transition:border-color .2s;
}
.search-box:focus-within{border-color:#00d9a0}
.search-icon{color:#8aabcc;font-size:14px;flex-shrink:0}
.search-inp{
  background:none;border:none;outline:none;
  color:#d6eeff;font-family:'Sora',sans-serif;font-size:.82rem;
  width:100%;padding:10px 0;
}
.search-inp::placeholder{color:#8aabcc}

/* ─── FILTER TABS ────────────────────── */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.tab{
  background:#112235;border:1px solid #1a3a5c;
  border-radius:20px;padding:6px 15px;
  font-size:.75rem;color:#8aabcc;cursor:pointer;
  font-family:'Sora',sans-serif;transition:all .2s;white-space:nowrap;
}
.tab:hover{border-color:#00d9a0;color:#00d9a0}
.tab.on{border-color:#00d9a0;color:#00d9a0;background:rgba(0,217,160,0.08)}

/* ─── SEC HEADER ─────────────────────── */
.sec{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-t{font-family:'Playfair Display',Georgia,serif;font-size:1.3rem;color:#fff;font-weight:700}
.clr-btn{
  background:rgba(255,107,107,0.08);
  border:1px solid #ff6b6b;border-radius:10px;
  padding:7px 15px;color:#ff6b6b;
  font-size:.75rem;cursor:pointer;
  font-family:'Sora',sans-serif;transition:all .2s;
}
.clr-btn:hover{background:#ff6b6b;color:#fff}

/* ─── LOG CARD ───────────────────────── */
.lc{
  background:#112235;border:1px solid #1a3a5c;
  border-radius:var(--rs);padding:16px 20px;
  margin-bottom:11px;
  animation:up .3s ease;
  transition:border-color .2s;
}
.lc:hover{border-color:#00d9a0}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.lq{
  font-size:.95rem;color:#fff;font-weight:600;
  margin-bottom:6px;display:flex;align-items:flex-start;gap:8px;
}
.lq-ic{opacity:.6;flex-shrink:0}
.la{
  font-size:.8rem;color:#8aabcc;line-height:1.65;margin-bottom:11px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.meta{display:flex;gap:7px;flex-wrap:wrap}

/* ─── BADGES ─────────────────────────── */
.bdg{font-size:.67rem;border-radius:20px;padding:3px 10px;border:1px solid}
.bt {color:#4da8ff;border-color:#4da8ff;background:rgba(77,168,255,0.08)}
.bm {color:#00d9a0;border-color:rgba(0,217,160,0.5);background:rgba(0,217,160,0.08)}
.bi {color:#4caf50;border-color:#4caf50;background:rgba(76,175,80,0.08)}
.bhi{color:#ff9f43;border-color:#ff9f43;background:rgba(255,159,67,0.08)}
.bhl{color:#a29bfe;border-color:#a29bfe;background:rgba(162,155,254,0.08)}
.ben{color:#4da8ff;border-color:#4da8ff;background:rgba(77,168,255,0.08)}

/* ─── EMPTY / LOADING ────────────────── */
.empty{text-align:center;padding:60px 20px;color:#8aabcc}
.empty-ic{font-size:3rem;margin-bottom:14px;display:block}
.empty a{color:#00d9a0;text-decoration:none}
.ldg{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px}
.spin{
  width:36px;height:36px;
  border:3px solid #1a3a5c;
  border-top-color:#00d9a0;
  border-radius:50%;
  animation:rot .9s linear infinite;
}
@keyframes rot{to{transform:rotate(360deg)}}

/* ─── RESPONSIVE ─────────────────────── */
@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  header{padding:12px 16px}
  .page{padding:20px 14px 40px}
  .htxt h1{font-size:1rem}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">📋</div>
  <div class="htxt">
    <h1>Medi<span>Bot</span> — History</h1>
    <p>Search Logs &amp; Analytics</p>
  </div>
  <div class="nav-area">
    <a href="/medicines" class="nav-btn">💊 Medicines</a>
    <a href="/" class="nav-btn">🤖 Chatbot</a>
  </div>
</header>

<div class="page">

  <!-- Demo Banner -->
  <div class="banner" id="banner">
    ✅ Demo mode — Flask + MongoDB connect hone par real data dikhe ga
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="sc"><span class="sc-icon">🔍</span><div class="sc-num empty" id="n-total">—</div><div class="sc-lbl">Total Searches</div></div>
    <div class="sc"><span class="sc-icon">📅</span><div class="sc-num empty" id="n-today">—</div><div class="sc-lbl">Aaj Ki Searches</div></div>
    <div class="sc"><span class="sc-icon">🖼</span><div class="sc-num empty" id="n-img">—</div><div class="sc-lbl">Image Mili</div></div>
    <div class="sc"><span class="sc-icon">💊</span><div class="sc-num empty" id="n-med">—</div><div class="sc-lbl">Medicine Match</div></div>
  </div>

  <!-- Language Bars -->
  <div class="card" id="lang-card" style="display:none">
    <div class="card-title">🌐 Language Distribution</div>
    <div id="lang-bars"></div>
  </div>

  <!-- Top Queries -->
  <div class="card" id="top-card" style="display:none">
    <div class="card-title">🔥 Sabse Zyada Searches</div>
    <div id="top-list"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔎</span>
      <input class="search-inp" id="qi" type="text" placeholder="Logs mein dhundho..." oninput="render()"/>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on"  onclick="flt('all',this)">🌐 Sab</button>
    <button class="tab"     onclick="flt('hindi',this)">🇮🇳 Hindi</button>
    <button class="tab"     onclick="flt('hinglish',this)">🗣 Hinglish</button>
    <button class="tab"     onclick="flt('english',this)">🇬🇧 English</button>
    <button class="tab"     onclick="flt('image',this)">🖼 Image Wale</button>
    <button class="tab"     onclick="flt('medicine',this)">💊 Medicine Match</button>
  </div>

  <!-- Section Header -->
  <div class="sec">
    <div class="sec-t">Recent Searches</div>
    <button class="clr-btn" onclick="clearAll()">🗑 Saare logs clear karo</button>
  </div>

  <!-- Logs -->
  <div id="logs">
    <div class="ldg"><div class="spin"></div><span style="color:#8aabcc">Loading history...</span></div>
  </div>

</div>

<script>
/* ── Sample data (demo mode ke liye) ── */
const DEMO_LOGS = [
  {query:"diabetes ka ilaj kya hai",ai_response:"Diabetes ek chronic bimari hai. Type 2 mein metformin pehli dawai hoti hai. Regular exercise aur diet control zaroori hai. Blood sugar monitor karte rahein.",searched_at:"23 Apr 2026, 02:30 PM",language:"hinglish",matched_medicine:"Metformin",image_found:true},
  {query:"बुखार में क्या करें",ai_response:"बुखार में सबसे पहले पेरासिटामोल 500mg लें। खूब पानी पिएं और आराम करें। अगर बुखार 3 दिन से ज्यादा रहे तो डॉक्टर से मिलें।",searched_at:"23 Apr 2026, 01:15 PM",language:"hindi",matched_medicine:"Paracetamol",image_found:false},
  {query:"What is hypertension?",ai_response:"Hypertension is a condition where blood pressure is persistently elevated above 140/90 mmHg. It is called the silent killer because it often has no symptoms. Lifestyle changes and medication help control it.",searched_at:"23 Apr 2026, 11:45 AM",language:"english",matched_medicine:"Hypertension",image_found:true},
  {query:"sir dard ki dawa batao",ai_response:"Sir dard ke liye Paracetamol 500mg ya Ibuprofen 400mg le sakte hain. Pani kam peena bhi sar dard ki wajah ban sakta hai. Zyada screen time bhi sir dard deta hai.",searched_at:"23 Apr 2026, 10:20 AM",language:"hinglish",matched_medicine:"Paracetamol",image_found:false},
  {query:"मलेरिया के लक्षण",ai_response:"मलेरिया के मुख्य लक्षण हैं बार-बार बुखार आना, ठंड लगना और पसीना आना। यह Plasmodium परजीवी से होता है। मच्छरदानी का उपयोग करें।",searched_at:"23 Apr 2026, 09:00 AM",language:"hindi",matched_medicine:"Malaria",image_found:true},
  {query:"How does aspirin work?",ai_response:"Aspirin blocks COX enzymes that produce prostaglandins causing pain and inflammation. At low doses it prevents blood clots. It is used for pain relief and heart attack prevention.",searched_at:"22 Apr 2026, 06:30 PM",language:"english",matched_medicine:"Aspirin",image_found:true},
  {query:"asthma ka inhaler kab lena chahiye",ai_response:"Asthma inhaler symptoms aane par turant lena chahiye. Salbutamol rescue inhaler hota hai. Doctor ki salah se daily preventive inhaler bhi use karte hain.",searched_at:"22 Apr 2026, 04:10 PM",language:"hinglish",matched_medicine:null,image_found:false},
  {query:"विटामिन D की कमी",ai_response:"विटामिन D की कमी से हड्डियां कमजोर होती हैं। धूप में बैठना सबसे अच्छा उपाय है। डॉक्टर 60,000 IU साप्ताहिक सप्लीमेंट दे सकते हैं।",searched_at:"22 Apr 2026, 02:00 PM",language:"hindi",matched_medicine:"Vitamin D",image_found:false}
];
const DEMO_STATS = {
  total_searches:8, today_searches:5, image_found:4, medicine_matched:7,
  top_queries:[{query:"diabetes ka ilaj kya hai",count:3},{query:"बुखार में क्या करें",count:2},{query:"sir dard ki dawa batao",count:2},{query:"What is hypertension?",count:1}],
  language_stats:{hindi:3,hinglish:3,english:2}
};

let logs=[], curF='all', isDemo=false;

/* ── stat update ── */
function setN(id,v){
  const el=document.getElementById(id);
  el.textContent=v??'0';
  el.classList.remove('empty');
}

/* ── language bars ── */
function drawLang(ls,total){
  if(!ls||!Object.keys(ls).length)return;
  document.getElementById('lang-card').style.display='block';
  const cfg=[
    {k:'hindi',    l:'🇮🇳 Hindi',    c:'#ff9f43'},
    {k:'hinglish', l:'🗣 Hinglish', c:'#a29bfe'},
    {k:'english',  l:'🇬🇧 English',  c:'#4da8ff'}
  ];
  document.getElementById('lang-bars').innerHTML=cfg.map(x=>{
    const n=ls[x.k]||0, pct=total?Math.round(n/total*100):0;
    return `<div class="lang-row">
      <span class="lang-lbl">${x.l}</span>
      <div class="lang-track"><div class="lang-fill" data-w="${pct}" style="background:${x.c}"></div></div>
      <span class="lang-cnt">${n}</span>
    </div>`;
  }).join('');
  /* animate bars after paint */
  setTimeout(()=>{
    document.querySelectorAll('.lang-fill').forEach(el=>{
      el.style.width=el.dataset.w+'%';
    });
  },80);
}

/* ── top queries ── */
function drawTop(tq){
  if(!tq||!tq.length)return;
  document.getElementById('top-card').style.display='block';
  document.getElementById('top-list').innerHTML=tq.map(q=>`
    <div class="tq-item">
      <span class="tq-text">${x(q.query)}</span>
      <span class="tq-cnt">${q.count}x</span>
    </div>`).join('');
}

/* ── load stats ── */
async function loadStats(){
  try{
    const r=await fetch('/api/logs/stats',{signal:AbortSignal.timeout(4000)});
    const d=await r.json();
    if(!d.success)throw 0;
    const s=d.data;
    setN('n-total',s.total_searches??0);
    setN('n-today',s.today_searches??0);
    setN('n-img',  s.image_found??0);
    setN('n-med',  s.medicine_matched??0);
    drawTop(s.top_queries);
    drawLang(s.language_stats,s.total_searches);
  }catch{
    isDemo=true;
    document.getElementById('banner').style.display='flex';
    setN('n-total',DEMO_STATS.total_searches);
    setN('n-today',DEMO_STATS.today_searches);
    setN('n-img',  DEMO_STATS.image_found);
    setN('n-med',  DEMO_STATS.medicine_matched);
    drawTop(DEMO_STATS.top_queries);
    drawLang(DEMO_STATS.language_stats,DEMO_STATS.total_searches);
  }
}

/* ── load logs ── */
async function loadLogs(){
  try{
    const r=await fetch('/api/logs?limit=200',{signal:AbortSignal.timeout(4000)});
    const d=await r.json();
    if(!d.success||!d.data)throw 0;
    logs=d.data;
  }catch{
    logs=DEMO_LOGS;
  }
  render();
}

/* ── render ── */
function render(){
  const wrap=document.getElementById('logs');
  const q=(document.getElementById('qi').value||'').toLowerCase();
  const f=logs.filter(l=>{
    if(curF==='hindi'    &&l.language!=='hindi')   return false;
    if(curF==='hinglish' &&l.language!=='hinglish')return false;
    if(curF==='english'  &&l.language!=='english') return false;
    if(curF==='image'    &&!l.image_found)         return false;
    if(curF==='medicine' &&!l.matched_medicine)    return false;
    if(q&&!(l.query+' '+l.ai_response).toLowerCase().includes(q))return false;
    return true;
  });
  if(!f.length){
    wrap.innerHTML=`<div class="empty">
      <span class="empty-ic">📭</span>
      Koi log nahi mila<br>
      <a href="/">Chatbot pe jao aur kuch poochho</a>
    </div>`;
    return;
  }
  wrap.innerHTML=f.map(l=>`
    <div class="lc">
      <div class="lq"><span class="lq-ic">❓</span><span>${x(l.query)}</span></div>
      <div class="la">${x(l.ai_response)}</div>
      <div class="meta">
        <span class="bdg bt">🕐 ${x(l.searched_at)}</span>
        ${lb(l.language)}
        ${l.matched_medicine?`<span class="bdg bm">💊 ${x(l.matched_medicine)}</span>`:''}
        ${l.image_found?`<span class="bdg bi">🖼 Image mili</span>`:''}
      </div>
    </div>`).join('');
}

/* ── language badge ── */
function lb(lang){
  if(lang==='hindi')    return`<span class="bdg bhi">🇮🇳 Hindi</span>`;
  if(lang==='hinglish') return`<span class="bdg bhl">🗣 Hinglish</span>`;
  if(lang==='english')  return`<span class="bdg ben">🇬🇧 English</span>`;
  return'';
}

/* ── filter ── */
function flt(f,btn){
  curF=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  render();
}

/* ── clear ── */
async function clearAll(){
  if(isDemo){alert('⚠️ Demo mode mein clear nahi ho sakta. Flask server chalao.');return;}
  if(!confirm('Saare search logs delete karein? Ye undo nahi ho sakta.'))return;
  try{
    const r=await fetch('/api/logs',{method:'DELETE'});
    const d=await r.json();
    if(d.success){
      logs=[];render();
      ['n-total','n-today','n-img','n-med'].forEach(id=>{
        const el=document.getElementById(id);
        el.textContent='0';
      });
      alert('✅ '+d.message);
    }else alert('❌ '+d.error);
  }catch(e){alert('❌ '+e.message);}
}

/* ── escape html ── */
function x(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── init ── */
loadStats();
loadLogs();
</script>
</body>
</html>
